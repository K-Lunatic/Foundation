<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>터틀넥 · 연습 시험지</title><link rel="stylesheet" href="../style.css"><script src="quiz.js" defer></script></head>
<body><main><h1>터틀넥 · 연습 시험지</h1>
<p>예제 자료를 읽고 두 문제를 풀어 보세요. 문제와 해설은 이 체험용으로 준비했으며 채점은 브라우저에서 진행됩니다.</p>
<section><h2>예제 강의자료 · 운영체제</h2><ol><li>한 프로세스의 스레드는 같은 주소 공간을 사용하지만 각각의 스택을 가진다.</li><li>교착 상태의 필요조건에는 상호 배제, 점유 대기, 비선점, 순환 대기가 있다.</li></ol></section>
<form id="exam">
<fieldset data-answer="stack" data-explanation="스레드마다 함수 호출과 지역 변수를 기록할 스택이 있어요. (예제 자료 1항)">
<legend>1. 같은 프로세스에서 스레드별로 따로 가지는 것은?</legend>
<label><input type="radio" name="one" value="heap" required> 힙</label><label><input type="radio" name="one" value="stack"> 스택</label><p class="feedback" hidden></p></fieldset>
<fieldset data-answer="cycle" data-explanation="서로의 자원을 원형으로 기다리는 상태는 순환 대기예요. (예제 자료 2항)">
<legend>2. 서로의 자원을 원형으로 기다리는 상태는?</legend>
<label><input type="radio" name="two" value="cycle" required> 순환 대기</label><label><input type="radio" name="two" value="preempt"> 선점</label><p class="feedback" hidden></p></fieldset>
<button type="submit">채점하기</button> <button type="reset">다시 풀기</button><output id="score" aria-live="polite"></output></form>
<p><a href="https://github.com/K-Lunatic/Turtleneck">터틀넥 설치 및 문제 생성 기능</a></p>
</main></body></html>
